<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeacherFlow Pro — Plan less. Teach better.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TEACHERFLOW PRO — DESIGN TOKENS
   ========================================================= */
:root{
  --ivory:#F7F3EC;
  --sage:#DDE6D8;
  --olive:#65745B;
  --olive-deep:#4E5A46;
  --charcoal:#30352F;
  --gray:#77766F;
  --terracotta:#B97963;
  --cream:#FFFDF8;

  --bg:var(--ivory);
  --surface:var(--cream);
  --surface-2:#F1EDE4;
  --band:var(--sage);
  --text:var(--charcoal);
  --muted:var(--gray);
  --accent:var(--olive);
  --accent-soft:rgba(101,116,91,.10);
  --clay:var(--terracotta);
  --clay-soft:rgba(185,121,99,.12);
  --line:rgba(48,53,47,.12);
  --line-soft:rgba(48,53,47,.07);
  --shadow:0 1px 2px rgba(48,53,47,.05), 0 8px 24px -12px rgba(48,53,47,.18);
  --shadow-lg:0 24px 60px -28px rgba(48,53,47,.42);
  --r-sm:8px; --r:14px; --r-lg:20px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sidebar-w:252px;
}
[data-theme="dark"]{
  --bg:#1E221C;
  --surface:#262B23;
  --surface-2:#2E3429;
  --band:#333A2E;
  --text:#EDEAE0;
  --muted:#A3A79A;
  --accent:#9DB08E;
  --accent-soft:rgba(157,176,142,.14);
  --clay:#D2937C;
  --clay-soft:rgba(210,147,124,.16);
  --line:rgba(237,234,224,.14);
  --line-soft:rgba(237,234,224,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -28px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:500; letter-spacing:-.01em; margin:0}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* =========================================================
   APP SHELL + SIDEBAR
   ========================================================= */
.app{display:flex; min-height:100vh}

.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--surface); border-right:1px solid var(--line);
  padding:22px 14px; position:fixed; inset:0 auto 0 0; height:100vh;
  display:flex; flex-direction:column; gap:18px; z-index:60;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.brand{display:flex; align-items:center; gap:11px; padding:0 8px 2px}
.brand-mark{
  width:38px; height:38px; border-radius:11px; flex:0 0 38px;
  background:var(--accent); color:var(--cream);
  display:grid; place-items:center; font-family:var(--serif); font-size:19px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
.brand-name{font-family:var(--serif); font-size:18px; line-height:1.15; display:block}
.brand-tag{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}

.searchbox{position:relative; padding:0 6px}
.searchbox input{
  width:100%; padding:9px 12px 9px 32px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
}
.searchbox input::placeholder{color:var(--muted)}
.searchbox svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); opacity:.5}

.nav{display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1; margin:0 -4px; padding:0 4px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.nav-item{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:9px 11px; border-radius:10px; border:0; background:transparent;
  color:var(--muted); cursor:pointer; text-align:left; font-size:14px; font-weight:500;
  transition:background .16s, color .16s;
}
.nav-item:hover{background:var(--accent-soft); color:var(--text)}
.nav-item.active{background:var(--accent); color:var(--cream)}
.nav-item.active svg{opacity:1}
.nav-item svg{width:17px; height:17px; flex:0 0 17px; opacity:.75}
.nav-foot{border-top:1px solid var(--line-soft); padding:12px 8px 0; display:flex; align-items:center; justify-content:space-between; gap:8px}
.who{min-width:0}
.who b{display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who span{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.icon-btn{
  width:34px; height:34px; flex:0 0 34px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); display:grid; place-items:center; cursor:pointer; color:var(--text);
  transition:background .16s, transform .16s;
}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn:active{transform:scale(.94)}

/* Topbar (mobile) */
.topbar{
  display:none; position:sticky; top:0; z-index:50; align-items:center; gap:12px;
  padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line);
}
.scrim{display:none; position:fixed; inset:0; background:rgba(30,34,28,.42); z-index:55; backdrop-filter:blur(2px)}
.scrim.show{display:block}

.main{margin-left:var(--sidebar-w); flex:1; min-width:0; padding:34px 38px 90px}
.view{display:none; animation:rise .3s cubic-bezier(.2,.7,.3,1)}
.view.active{display:block}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* =========================================================
   COMMON PIECES
   ========================================================= */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:24px}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.page-head h1{font-size:31px}
.page-head p{margin:6px 0 0; color:var(--muted); font-size:14px}
.head-actions{display:flex; gap:9px; flex-wrap:wrap}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-size:13.5px; font-weight:600; cursor:pointer;
  transition:background .16s, border-color .16s, transform .12s, box-shadow .16s;
}
.btn:hover{background:var(--surface-2); box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px; height:15px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--cream)}
.btn.primary:hover{background:var(--olive-deep); border-color:var(--olive-deep)}
[data-theme="dark"] .btn.primary{color:#1E221C}
.btn.clay{background:var(--clay); border-color:var(--clay); color:#fff}
.btn.clay:hover{filter:brightness(.94)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--clay); border-color:var(--clay-soft)}
.btn.sm{padding:6px 11px; font-size:12.5px; border-radius:9px}
.btn.tiny{padding:4px 9px; font-size:12px; border-radius:8px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow)}
.card + .card{margin-top:18px}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.card-head h2{font-size:19px}
.card-head h3{font-size:16.5px}
.sub{color:var(--muted); font-size:13px}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:18px; align-items:start}

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:11.5px; font-weight:600; background:var(--accent-soft); color:var(--accent);
  border:1px solid transparent; white-space:nowrap;
}
.chip.clay{background:var(--clay-soft); color:var(--clay)}
.chip.plain{background:var(--surface-2); color:var(--muted)}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px; display:inline-block}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:12px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--muted)}
.field .hint{font-size:12px; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=url],select,textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); transition:border-color .16s, background .16s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); background:var(--surface); outline:none}
textarea{resize:vertical; min-height:82px; line-height:1.55}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.toolbar select,.toolbar input{width:auto; min-width:150px; padding:8px 12px; font-size:13.5px}
.toolbar select{padding-right:32px}

.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 13px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:.16s}
.seg button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:0 12px 10px; white-space:nowrap}
td{padding:12px; border-top:1px solid var(--line-soft); vertical-align:middle}
tbody tr{transition:background .16s}
tbody tr:hover{background:var(--accent-soft)}
.table-wrap{overflow-x:auto; margin:0 -6px; padding:0 6px}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
.rowacts{display:flex; gap:6px; justify-content:flex-end}

.empty{text-align:center; padding:46px 22px}
.empty-mark{width:56px; height:56px; margin:0 auto 16px; border-radius:17px; background:var(--band); color:var(--accent); display:grid; place-items:center}
.empty-mark svg{width:25px; height:25px}
.empty h3{font-size:18px; margin-bottom:6px}
.empty p{color:var(--muted); font-size:13.5px; max-width:320px; margin:0 auto 18px}

.progress{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.progress span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s cubic-bezier(.2,.7,.3,1)}

/* =========================================================
   DASHBOARD
   ========================================================= */
.hero{
  background:var(--band); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:28px 30px; margin-bottom:20px; position:relative; overflow:hidden;
}
.hero h1{font-size:32px; margin-bottom:6px}
.hero .date{font-size:13px; color:var(--olive-deep); letter-spacing:.05em; text-transform:uppercase; font-weight:600}
[data-theme="dark"] .hero .date{color:var(--accent)}
.hero .motto{margin-top:14px; font-family:var(--serif); font-style:italic; font-size:16px; color:var(--muted)}
.hero-rule{position:absolute; right:-40px; top:-40px; width:190px; height:190px; border-radius:50%; border:1px solid var(--line); opacity:.6}
.hero-rule.two{right:10px; top:-90px; width:150px; height:150px}

.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow)}
.stat .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px}
.stat .label{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.stat .ico{width:32px; height:32px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.stat .ico svg{width:16px; height:16px}
.stat .big{font-family:var(--serif); font-size:32px; line-height:1}
.stat .foot{font-size:12.5px; color:var(--muted); margin-top:7px}

/* Signature: the day rail */
.rail{position:relative; padding-left:76px}
.rail::before{content:''; position:absolute; left:60px; top:6px; bottom:6px; width:1px; background:var(--line)}
.rail-item{position:relative; padding:13px 0}
.rail-item + .rail-item{border-top:1px solid var(--line-soft)}
.rail-time{position:absolute; left:-76px; top:15px; width:56px; text-align:right; font-size:12.5px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.rail-time small{display:block; font-weight:400; font-size:11px; opacity:.75}
.rail-item::after{content:''; position:absolute; left:-19px; top:20px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--accent)}
.rail-item.now::after{background:var(--clay); border-color:var(--clay); box-shadow:0 0 0 4px var(--clay-soft)}
.rail-row{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
.rail-title{font-weight:600; font-size:15px}
.rail-meta{font-size:12.5px; color:var(--muted); margin-top:3px}
.rail-lesson{font-size:13px; margin-top:6px; color:var(--text); display:flex; align-items:center; gap:7px}

.check{display:flex; align-items:flex-start; gap:11px; padding:10px 0; border-top:1px solid var(--line-soft)}
.check:first-child{border-top:0}
.check input{margin-top:2px; width:17px; height:17px; accent-color:var(--olive); flex:0 0 17px; cursor:pointer}
.check .t{flex:1; min-width:0; font-size:14px}
.check .m{font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.check.done .t{text-decoration:line-through; color:var(--muted)}
.quickadd{display:flex; gap:8px; margin-top:14px}
.quickadd input{flex:1}

.week{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}
.day{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--r); padding:13px; min-height:118px}
.day.today{border-color:var(--accent); background:var(--accent-soft)}
.day h4{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; font-family:var(--sans); font-weight:600}
.day .li{font-size:12.5px; padding:4px 0; border-top:1px solid var(--line-soft); display:flex; gap:6px; align-items:center}
.day .li:first-of-type{border-top:0}

.list-line{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-top:1px solid var(--line-soft)}
.list-line:first-child{border-top:0}
.ll-t{font-weight:600; font-size:14px}
.ll-m{font-size:12.5px; color:var(--muted); margin-top:2px}

/* =========================================================
   CALENDAR
   ========================================================= */
.cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.cal-dow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:center; padding-bottom:6px}
.cal-cell{
  min-height:104px; border:1px solid var(--line-soft); border-radius:12px; background:var(--surface-2);
  padding:8px; cursor:pointer; transition:border-color .16s, background .16s; overflow:hidden;
}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.out{opacity:.42}
.cal-cell.today{border-color:var(--accent); background:var(--accent-soft)}
.cal-cell .d{font-size:12.5px; font-weight:600; margin-bottom:6px; font-variant-numeric:tabular-nums}
.ev{
  font-size:11.5px; padding:3px 7px; border-radius:7px; margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--text);
}
.ev.lesson{border-color:#65745B; background:rgba(101,116,91,.12)}
.ev.assignment{border-color:#B97963; background:rgba(185,121,99,.13)}
.ev.meeting{border-color:#7E8FA6; background:rgba(126,143,166,.15)}
.ev.personal{border-color:#A98BA6; background:rgba(169,139,166,.15)}
.ev.deadline{border-color:#C25B4E; background:rgba(194,91,78,.14)}
.ev.other{border-color:#8C8C82; background:rgba(140,140,130,.14)}
.cal-week{display:grid; grid-template-columns:64px repeat(7,minmax(0,1fr)); gap:5px}
.cal-day-list{display:flex; flex-direction:column; gap:9px}
.slot{font-size:11px; color:var(--muted); text-align:right; padding-top:2px; font-variant-numeric:tabular-nums}
.slot-cell{min-height:42px; border-top:1px solid var(--line-soft); padding:2px}

/* =========================================================
   LESSON PLANNER / MISC
   ========================================================= */
.lesson-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.mat{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line-soft)}
.mat:first-child{border-top:0}
.mat input[type=checkbox]{width:16px; height:16px; accent-color:var(--olive); cursor:pointer}
.mat .x{margin-left:auto; cursor:pointer; color:var(--muted); background:0; border:0; padding:2px 6px; border-radius:6px}
.mat .x:hover{color:var(--clay); background:var(--clay-soft)}

.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px;
  box-shadow:var(--shadow); position:relative; transition:transform .18s, box-shadow .18s, border-color .18s;
}
.tile:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--line)}
.tile h3{font-size:17px; margin-bottom:4px}
.tile .band{position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:0 3px 3px 0; background:var(--accent)}
.tile-meta{font-size:12.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.tile-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-soft)}
.mini-stats{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px}
.mini-stats div{font-size:12.5px; color:var(--muted)}
.mini-stats b{display:block; font-family:var(--serif); font-size:19px; color:var(--text); font-weight:500}
.overdue{color:var(--clay); font-weight:600}

/* attendance buttons */
.att-set{display:inline-flex; gap:4px}
.att-btn{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.14s}
.att-btn:hover{border-color:var(--accent)}
.att-btn.on[data-s=present]{background:var(--accent); border-color:var(--accent); color:var(--cream)}
.att-btn.on[data-s=absent]{background:var(--clay); border-color:var(--clay); color:#fff}
.att-btn.on[data-s=late]{background:#C9A227; border-color:#C9A227; color:#2A2410}
.att-btn.on[data-s=excused]{background:#7E8FA6; border-color:#7E8FA6; color:#fff}
[data-theme="dark"] .att-btn.on[data-s=present]{color:#1E221C}

.gradecell{width:66px; padding:6px 8px; text-align:center; border-radius:8px; font-variant-numeric:tabular-nums}
.pct{font-weight:600; font-variant-numeric:tabular-nums}
.pct.low{color:var(--clay)}

.tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.tag{font-size:11px; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line-soft)}

/* charts */
.chart{display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:10px}
.bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
.bar{width:100%; max-width:52px; background:var(--accent); border-radius:7px 7px 3px 3px; min-height:3px; transition:height .5s cubic-bezier(.2,.7,.3,1); position:relative}
.bar.alt{background:var(--clay)}
.bar-val{font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums}
.bar-lbl{font-size:11px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.spark{width:100%; height:150px}

/* =========================================================
   MODAL / TOAST / SEARCH
   ========================================================= */
.modal-bg{
  position:fixed; inset:0; background:rgba(30,34,28,.5); backdrop-filter:blur(3px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:26px 16px; overflow-y:auto;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  width:100%; max-width:560px; box-shadow:var(--shadow-lg); margin:auto;
  animation:pop .22s cubic-bezier(.2,.7,.3,1);
}
.modal.wide{max-width:840px}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none}}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:20px 22px 0}
.modal-head h3{font-size:20px}
.modal-body{padding:18px 22px}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:0 22px 20px; flex-wrap:wrap}
.x-btn{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:22px; line-height:1; padding:4px 8px; border-radius:8px}
.x-btn:hover{background:var(--surface-2); color:var(--text)}

.toasts{position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:9px; align-items:flex-end}
.toast{
  background:var(--charcoal); color:var(--cream); padding:11px 16px; border-radius:11px;
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px;
  animation:slide .26s cubic-bezier(.2,.7,.3,1);
}
[data-theme="dark"] .toast{background:var(--sage); color:#22261F}
@keyframes slide{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}
.toast.out{opacity:0; transform:translateX(24px); transition:.3s}

.results-group{margin-bottom:20px}
.results-group h4{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-family:var(--sans); font-weight:600; margin-bottom:8px}
.result{padding:11px 12px; border-radius:11px; cursor:pointer; border:1px solid transparent}
.result:hover{background:var(--accent-soft); border-color:var(--line-soft)}
.result b{font-weight:600; font-size:14px}
.result span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}

.banner{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between;
  background:var(--clay-soft); border:1px solid rgba(185,121,99,.28); color:var(--text);
  border-radius:var(--r); padding:12px 16px; margin-bottom:20px; font-size:13.5px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .lesson-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--sidebar-w:264px}
  .sidebar{transform:translateX(-102%); box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0; padding:20px 16px 80px}
  .topbar{display:flex}
  .g3,.g2,.week{grid-template-columns:1fr}
  .week{gap:9px}
  .day{min-height:auto}
  .page-head h1{font-size:26px}
  .hero{padding:22px 20px}
  .hero h1{font-size:26px}
  .card{padding:17px; border-radius:var(--r)}
  .cal-cell{min-height:74px; padding:5px; border-radius:9px}
  .ev{font-size:10px; padding:2px 5px}
  .cal-week{grid-template-columns:44px repeat(7,minmax(0,1fr))}
  .btn{padding:10px 15px}
  .rail{padding-left:62px}
  .rail::before{left:48px}
  .rail-time{left:-62px; width:44px}
}
@media (max-width:560px){
  .g4,.lesson-grid,.row{grid-template-columns:1fr}
  .head-actions{width:100%}
  .head-actions .btn{flex:1; justify-content:center}
}

/* =========================================================
   PRINT
   ========================================================= */
@media print{
  .sidebar,.topbar,.head-actions,.toolbar,.no-print,.toasts,.scrim,.quickadd{display:none!important}
  .main{margin:0; padding:0}
  body{background:#fff; color:#000; font-size:12px}
  .card,.stat,.tile{box-shadow:none; border:1px solid #ccc; break-inside:avoid; page-break-inside:avoid}
  .hero{background:#fff; border:1px solid #ccc}
  .view{display:none!important}
  .view.active{display:block!important}
  a{text-decoration:none; color:#000}
  .cal-cell{min-height:78px}
}

      gradebook, attendance, to-do, goals, resources, notes, reports,
      settings)

   ========================================================================= */

   ========================================================================= */

/* --- date helpers (all dates are stored as plain YYYY-MM-DD strings) --- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = () => isoOf(new Date());
function shiftDay(days, from){ const d = from ? new Date(from + 'T12:00:00') : new Date(); d.setDate(d.getDate() + days); return isoOf(d); }
function dateObj(iso){ return new Date(iso + 'T12:00:00'); }
function fmtDate(iso, long){
  if (!iso) return '—';
  const d = dateObj(iso);
  return d.toLocaleDateString(undefined, long ? {weekday:'long', month:'long', day:'numeric', year:'numeric'} : {month:'short', day:'numeric', year:'numeric'});
}
function fmtShort(iso){ if(!iso) return '—'; return dateObj(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  return ((h % 12) || 12) + ':' + pad(m) + ' ' + ap;
}
function daysUntil(iso){ return Math.round((dateObj(iso) - dateObj(TODAY())) / 86400000); }
function relative(iso){
  const n = daysUntil(iso);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n < 0) return Math.abs(n) + ' days ago';
  if (n < 7) return 'In ' + n + ' days';
  return fmtShort(iso);
}

  try { localStorage.setItem(KEY, JSON.stringify(DB)); }

  try {

/* =========================================================================

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = icon('check', 15) + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2600);
}

let modalOnClose = null;
function openModal(title, bodyHTML, footHTML, wide){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML || '';
  $('#modal').classList.toggle('wide', !!wide);
  $('#modalBg').classList.add('show');
  const first = $('#modalBody input, #modalBody textarea, #modalBody select');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal(){
  $('#modalBg').classList.remove('show');
  $('#modalBody').innerHTML = '';
  if (modalOnClose){ const f = modalOnClose; modalOnClose = null; f(); }
}

/* Generic form builder — every create/edit dialog in the app uses this.
   fields: {key,label,type,options,hint,full,required,placeholder,rows} */
function openForm(opts){
  const fields = opts.fields, vals = opts.values || {};
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">';
  fields.forEach(f => {
    const v = vals[f.key] != null ? vals[f.key] : (f.default || '');
    const span = f.full === false ? '' : 'grid-column:1/-1;';
    html += '<div class="field" style="' + (f.half ? '' : span) + '">';
    html += '<label for="f_' + f.key + '">' + esc(f.label) + (f.hint ? ' <span class="hint">' + esc(f.hint) + '</span>' : '') + '</label>';
    if (f.type === 'textarea'){
      html += '<textarea id="f_' + f.key + '" name="' + f.key + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
    } else if (f.type === 'select'){
      html += '<select id="f_' + f.key + '" name="' + f.key + '">';
      (f.options || []).forEach(o => {
        const val = typeof o === 'object' ? o.v : o, lbl = typeof o === 'object' ? o.l : o;
        html += '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lbl) + '</option>';
      });
      html += '</select>';
    } else if (f.type === 'color'){
      html += '<div style="display:flex;gap:7px;flex-wrap:wrap" id="f_' + f.key + '" data-color="' + esc(v || CLASS_COLORS[0]) + '">';
      CLASS_COLORS.forEach(c => {
        html += '<button type="button" class="swatch" data-c="' + c + '" style="width:30px;height:30px;border-radius:9px;background:' + c + ';border:2px solid ' + (c === (v || CLASS_COLORS[0]) ? 'var(--text)' : 'transparent') + ';cursor:pointer"></button>';
      });
      html += '</div>';
    } else {
      html += '<input id="f_' + f.key + '" name="' + f.key + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '">';
    }
    html += '</div>';
  });
  html += '</div>';

  let foot = '';
  if (opts.onDelete) foot += '<button class="btn danger" id="formDelete" style="margin-right:auto">' + icon('trash', 14) + 'Delete</button>';
  foot += '<button class="btn" id="formCancel">Cancel</button>';
  foot += '<button class="btn primary" id="formSave">' + esc(opts.saveLabel || 'Save') + '</button>';

  openModal(opts.title, html, foot, opts.wide);

  $$('#modalBody .swatch').forEach(b => b.addEventListener('click', () => {
    const wrap = b.parentElement;
    wrap.dataset.color = b.dataset.c;
    $$('.swatch', wrap).forEach(x => x.style.borderColor = 'transparent');
    b.style.borderColor = 'var(--text)';
  }));

  function collect(){
    const out = {};
    fields.forEach(f => {
      const node = $('#f_' + f.key);
      if (!node) return;
      out[f.key] = f.type === 'color' ? node.dataset.color : (f.type === 'number' ? Number(node.value) : node.value.trim ? node.value.trim() : node.value);
    });
    return out;
  }
  $('#formCancel').onclick = closeModal;
  $('#formSave').onclick = () => {
    const data = collect();
    const missing = fields.filter(f => f.required && !String(data[f.key] || '').length);
    if (missing.length){ toast('Add a ' + missing[0].label.toLowerCase() + ' to continue.'); const n = $('#f_' + missing[0].key); if (n) n.focus(); return; }
    closeModal();
    opts.onSave(data);
  };
  if (opts.onDelete) $('#formDelete').onclick = () => {
    closeModal();
    confirmAction('Delete this?', opts.deleteMsg || 'This cannot be undone.', 'Delete', opts.onDelete);
  };
}

function confirmAction(title, msg, label, onYes){
  openModal(title, '<p style="margin:0;color:var(--muted);font-size:14px">' + esc(msg) + '</p>',
    '<button class="btn" id="cNo">Cancel</button><button class="btn clay" id="cYes">' + esc(label) + '</button>');
  $('#cNo').onclick = closeModal;
  $('#cYes').onclick = () => { closeModal(); onYes(); };
}

  ).join('');

  if (RENDERERS[view]) RENDERERS[view]();

}

/* Shared page header builder */
function pageHead(eyebrow, title, sub, actions){
  return '<div class="page-head no-print"><div><div class="eyebrow">' + esc(eyebrow) + '</div><h1>' + esc(title) + '</h1>' +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div><div class="head-actions">' + (actions || '') + '</div></div>';
}
function emptyState(iconName, title, msg, btnLabel, btnId){
  return '<div class="empty"><div class="empty-mark">' + icon(iconName, 25) + '</div><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p>' +
    (btnLabel ? '<button class="btn primary" id="' + btnId + '">' + icon('plus', 14) + esc(btnLabel) + '</button>' : '') + '</div>';
}
function classOptions(includeBlank){
  const o = DB.classes.map(c => ({v:c.id, l:c.name + ' — ' + c.grade}));
  return includeBlank ? [{v:'', l:'— None —'}].concat(o) : o;
}

<script>

function todaySchedule(){

}
function greeting(){

const MOTTOS = [
  'Small steps create great classrooms.',

RENDERERS.dashboard = function(){
  const s = DB.settings;
  const sched = todaySchedule();
  const weekAhead = DB.assignments.filter(a => a.due && daysUntil(a.due) >= 0 && daysUntil(a.due) <= 7);

    {l:'Classes today', v:sched.length, f:sched.length ? 'First bell at ' + fmtTime(sched[0].start) : 'Nothing scheduled', i:'classes'},

function mondayOfThisWeek(dayIndex){
  const now = new Date();
  const diff = dayIndex - now.getDay();
  return shiftDay(diff);
}
function upcomingItems(limit){
  const out = [];
  DB.assignments.forEach(a => { if (a.due && daysUntil(a.due) >= 0) out.push({date:a.due, title:a.name, meta:'Assignment due · ' + className(a.classId) + ' · ' + a.points + ' pts'}); });
  DB.events.forEach(e => { if (daysUntil(e.date) >= 0) out.push({date:e.date, title:e.title, meta:e.category + (e.start ? ' · ' + fmtTime(e.start) : '')}); });
  DB.lessons.forEach(l => { if (l.date && daysUntil(l.date) > 0) out.push({date:l.date, title:l.title, meta:'Lesson · ' + className(l.classId)}); });
  DB.tasks.forEach(t => { if (!t.done && t.due && daysUntil(t.due) > 0) out.push({date:t.due, title:t.title, meta:'Task · ' + t.cat}); });
  return out.sort((a, b) => a.date.localeCompare(b.date)).slice(0, limit || 6);
}

/* one to-do row, reused by dashboard + to-do view */
function taskLine(t){
  return '<label class="check' + (t.done ? ' done' : '') + '">' +
    '<input type="checkbox" data-task-toggle="' + t.id + '"' + (t.done ? ' checked' : '') + '>' +
    '<span class="t">' + esc(t.title) +
    '<span class="m"><span class="chip plain">' + esc(t.cat) + '</span>' +
    '<span' + (t.due && daysUntil(t.due) < 0 && !t.done ? ' class="overdue"' : '') + '>' + (t.due ? esc(relative(t.due)) : 'No date') + '</span>' +
    (t.priority === 'High' ? '<span class="chip clay">High</span>' : '') +
    (t.notes ? '<span>' + esc(t.notes) + '</span>' : '') + '</span></span>' +
    '<button class="btn tiny no-print" data-task-edit="' + t.id + '">' + icon('edit', 12) + '</button></label>';
}
function wireTaskLines(root){
  $$('[data-task-toggle]', root).forEach(cb => cb.onclick = e => {
    e.stopPropagation();
    const t = byId(DB.tasks, cb.dataset.taskToggle);
    t.done = cb.checked; save();
    if (UI.view === 'todo') RENDERERS.todo(); else RENDERERS.dashboard();
  });
  $$('[data-task-edit]', root).forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); taskForm(b.dataset.taskEdit); });
}

/* schedule item dialog */
function scheduleForm(id){
  if (!DB.classes.length){ toast('Create a class first.'); go('classes'); return; }
  const it = id ? byId(DB.schedule, id) : null;
  openForm({
    title: it ? 'Edit class period' : 'Add class period',
    values: it || {day:String(new Date().getDay()), start:'08:30', end:'09:20', status:'Planned'},
    fields:[
      {key:'classId', label:'Class', type:'select', options:classOptions(), half:true},
      {key:'day', label:'Day', type:'select', half:true, options:[{v:'1',l:'Monday'},{v:'2',l:'Tuesday'},{v:'3',l:'Wednesday'},{v:'4',l:'Thursday'},{v:'5',l:'Friday'},{v:'6',l:'Saturday'},{v:'0',l:'Sunday'}]},
      {key:'start', label:'Starts', type:'time', half:true},
      {key:'end', label:'Ends', type:'time', half:true},
      {key:'room', label:'Room', half:true},
      {key:'status', label:'Status', type:'select', half:true, options:['Planned','Draft','Taught','Cancelled']},
      {key:'lesson', label:'Lesson title', placeholder:'What are you teaching?'}
    ],
    onSave(v){
      if (it) Object.assign(it, v);
      else DB.schedule.push(Object.assign({id:uid()}, v));
      save(); toast('Schedule updated.'); RENDERERS.dashboard();
    },
    onDelete: it ? () => { DB.schedule = DB.schedule.filter(x => x.id !== id); save(); toast('Class period removed.'); RENDERERS.dashboard(); } : null
  });
}

/* =========================================================================
   5b. CALENDAR
   ========================================================================= */
function calItems(iso){
  const out = [];
  DB.events.filter(e => e.date === iso).forEach(e => out.push({kind:'event', id:e.id, title:e.title, cat:e.category, time:e.start}));
  DB.assignments.filter(a => a.due === iso).forEach(a => out.push({kind:'assignment', id:a.id, title:a.name + ' due', cat:'Assignment', time:''}));
  DB.lessons.filter(l => l.date === iso).forEach(l => out.push({kind:'lesson', id:l.id, title:l.title, cat:'Lesson', time:''}));
  return out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
function evChip(it, showTime){
  return '<div class="ev ' + it.cat.toLowerCase() + '" data-cal="' + it.kind + ':' + it.id + '">' +
    (showTime && it.time ? '<b>' + esc(fmtTime(it.time)) + '</b> ' : '') + esc(it.title) + '</div>';
}

RENDERERS.calendar = function(){
  const cur = dateObj(UI.calCursor);
  let h = pageHead('Calendar', MONTHS[cur.getMonth()] + ' ' + cur.getFullYear(), 'Lessons, assignments and everything else in one month view.',
    '<div class="seg">' + ['month','week','day'].map(m => '<button data-mode="' + m + '"' + (UI.calMode === m ? ' class="on"' : '') + '>' + m[0].toUpperCase() + m.slice(1) + '</button>').join('') + '</div>' +
    '<button class="btn" id="calPrev">‹</button><button class="btn" id="calToday">Today</button><button class="btn" id="calNext">›</button>' +
    '<button class="btn primary" id="calAdd">' + icon('plus', 14) + 'New event</button>');

  h += '<div class="card">';
  if (UI.calMode === 'month') h += monthGrid(cur);
  else if (UI.calMode === 'week') h += weekGrid(cur);
  else h += dayList(UI.calCursor);
  h += '</div>';

  h += '<div class="card no-print"><div class="card-head"><h3>Category key</h3></div><div style="display:flex;gap:9px;flex-wrap:wrap">' +
    CATEGORIES.map(c => '<span class="ev ' + c.toLowerCase() + '" style="cursor:default">' + c + '</span>').join('') + '</div></div>';

  $('#view-calendar').innerHTML = h;

  $$('[data-mode]').forEach(b => b.onclick = () => { UI.calMode = b.dataset.mode; RENDERERS.calendar(); });
  $('#calToday').onclick = () => { UI.calCursor = TODAY(); RENDERERS.calendar(); };
  $('#calPrev').onclick = () => { UI.calCursor = calStep(-1); RENDERERS.calendar(); };
  $('#calNext').onclick = () => { UI.calCursor = calStep(1); RENDERERS.calendar(); };
  $('#calAdd').onclick = () => eventForm(null, UI.calCursor);
  $$('[data-day]').forEach(c => c.onclick = e => { if (!e.target.closest('.ev')) eventForm(null, c.dataset.day); });
  $$('[data-cal]').forEach(c => c.onclick = e => {
    e.stopPropagation();
    const [kind, id] = c.dataset.cal.split(':');
    if (kind === 'event') eventDetails(id);
    else if (kind === 'assignment') assignmentForm(id);
    else openLesson(id);
  });
};
function calStep(dir){
  const d = dateObj(UI.calCursor);
  if (UI.calMode === 'month'){ d.setDate(1); d.setMonth(d.getMonth() + dir); }
  else if (UI.calMode === 'week') d.setDate(d.getDate() + 7 * dir);
  else d.setDate(d.getDate() + dir);
  return isoOf(d);
}
function monthGrid(cur){
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  let h = '<div class="cal-grid">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => '<div class="cal-dow">' + d + '</div>').join('') + '</div><div class="cal-grid">';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoOf(d), out = d.getMonth() !== cur.getMonth();
    const items = calItems(iso);
    h += '<div class="cal-cell' + (out ? ' out' : '') + (iso === TODAY() ? ' today' : '') + '" data-day="' + iso + '">' +
      '<div class="d">' + d.getDate() + '</div>' + items.slice(0, 3).map(it => evChip(it)).join('') +
      (items.length > 3 ? '<div class="sub" style="font-size:10.5px;padding-left:3px">+' + (items.length - 3) + ' more</div>' : '') + '</div>';
    if (i % 7 === 6 && d > new Date(cur.getFullYear(), cur.getMonth() + 1, 0)) break;
  }
  return h + '</div>';
}
function weekGrid(cur){
  const start = new Date(cur); start.setDate(cur.getDate() - cur.getDay());
  let h = '<div class="cal-grid">';
  for (let i = 0; i < 7; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    h += '<div class="cal-dow">' + DOW[d.getDay()].slice(0, 3) + ' ' + d.getDate() + '</div>';
  }
  h += '</div><div class="cal-grid">';
  for (let i = 0; i < 7; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoOf(d);
    h += '<div class="cal-cell" style="min-height:180px" data-day="' + iso + '">' +
      (iso === TODAY() ? '<div class="chip" style="margin-bottom:6px">Today</div>' : '') +
      calItems(iso).map(it => evChip(it, true)).join('') + '</div>';
  }
  return h + '</div>';
}
function dayList(iso){
  const items = calItems(iso);
  const sched = DB.schedule.filter(s => Number(s.day) === dateObj(iso).getDay()).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  let h = '<div class="card-head"><div><h3>' + fmtDate(iso, true) + '</h3><div class="sub">' + items.length + ' events · ' + sched.length + ' class periods</div></div></div>';
  h += '<div class="split" style="gap:20px"><div>';
  h += '<h4 style="font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--sans);margin-bottom:10px">Events</h4>';
  h += items.length ? '<div class="cal-day-list">' + items.map(it => evChip(it, true)).join('') + '</div>' : '<p class="sub">Nothing scheduled. Click below to add something.</p>';
  h += '<button class="btn sm no-print" style="margin-top:12px" data-day="' + iso + '">' + icon('plus', 13) + 'Add event</button></div><div>';
  h += '<h4 style="font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--sans);margin-bottom:10px">Class periods</h4>';
  h += sched.length ? sched.map(s =>
      '<div class="list-line"><div><div class="ll-t">' + esc(className(s.classId)) + '</div><div class="ll-m">' + esc(s.lesson || 'No lesson title') + '</div></div>' +
      '<span class="chip plain">' + esc(fmtTime(s.start)) + '</span></div>').join('')
    : '<p class="sub">No classes on this day.</p>';
  return h + '</div></div>';
}
function eventForm(id, presetDate){
  const e = id ? byId(DB.events, id) : null;
  openForm({
    title: e ? 'Edit event' : 'New event',
    values: e || {date:presetDate || TODAY(), category:'Lesson'},
    fields:[
      {key:'title', label:'Title', required:true, placeholder:'What is happening?'},
      {key:'date', label:'Date', type:'date', half:true},
      {key:'category', label:'Category', type:'select', options:CATEGORIES, half:true},
      {key:'start', label:'Starts', type:'time', half:true},
      {key:'end', label:'Ends', type:'time', half:true},
      {key:'notes', label:'Notes', type:'textarea', rows:3}
    ],
    onSave(v){
      if (e) Object.assign(e, v); else DB.events.push(Object.assign({id:uid()}, v));
      save(); toast(e ? 'Event updated.' : 'Event added.'); RENDERERS.calendar();
    },
    onDelete: e ? () => { DB.events = DB.events.filter(x => x.id !== id); save(); toast('Event deleted.'); RENDERERS.calendar(); } : null
  });
}
function eventDetails(id){
  const e = byId(DB.events, id);
  if (!e) return;
  const body = '<div class="chip" style="margin-bottom:12px">' + esc(e.category) + '</div>' +
    '<p style="margin:0 0 6px"><b>' + esc(fmtDate(e.date, true)) + '</b></p>' +
    '<p class="sub" style="margin:0 0 12px">' + (e.start ? esc(fmtTime(e.start)) + (e.end ? ' – ' + esc(fmtTime(e.end)) : '') : 'All day') + '</p>' +
    (e.notes ? '<p style="margin:0;white-space:pre-wrap">' + esc(e.notes) + '</p>' : '<p class="sub" style="margin:0">No notes.</p>');
  openModal(e.title, body,
    '<button class="btn danger" id="evDel" style="margin-right:auto">' + icon('trash', 13) + 'Delete</button>' +
    '<button class="btn" id="evDup">' + icon('copy', 13) + 'Duplicate</button>' +
    '<button class="btn primary" id="evEdit">' + icon('edit', 13) + 'Edit</button>');
  $('#evEdit').onclick = () => { closeModal(); eventForm(id); };
  $('#evDup').onclick = () => { const c = Object.assign({}, e, {id:uid(), title:e.title + ' (copy)'}); delete c.sample; DB.events.push(c); save(); closeModal(); toast('Event duplicated.'); RENDERERS.calendar(); };
  $('#evDel').onclick = () => { closeModal(); confirmAction('Delete event?', 'This removes “' + e.title + '” from your calendar.', 'Delete', () => { DB.events = DB.events.filter(x => x.id !== id); save(); toast('Event deleted.'); RENDERERS.calendar(); }); };
}

/* =========================================================================
   5c. LESSON PLANNER
   ========================================================================= */
let draft = null;
const LESSON_SECTIONS = [
  {k:'objective', l:'Learning objective', p:'What should students know or be able to do?', rows:3},
  {k:'warmup', l:'Warm-up / bell ringer', p:'The first five minutes.', rows:3},
  {k:'intro', l:'Introduction', p:'How you open the lesson.', rows:3},
  {k:'instruction', l:'Instruction', p:'Direct teaching, modelling, think-alouds.', rows:4},
  {k:'guided', l:'Guided practice', p:'What you do together.', rows:3},
  {k:'independent', l:'Independent practice', p:'What students do on their own.', rows:3},
  {k:'assessment', l:'Assessment', p:'How you will know they got it.', rows:3},
  {k:'homework', l:'Homework', p:'What goes home.', rows:2},
  {k:'differentiation', l:'Differentiation', p:'Support and extension.', rows:3},
  {k:'notes', l:'Teacher notes', p:'Reminders for future you.', rows:3}
];
function newDraft(){
  return {id:null, title:'', subject:DB.settings.defaultSubject || '', grade:DB.settings.defaultGrade || '', classId:(DB.classes[0] || {}).id || '',
    date:TODAY(), duration:'50 min', unit:'', standard:'', materials:[],
    objective:'', warmup:'', intro:'', instruction:'', guided:'', independent:'', assessment:'', homework:'', differentiation:'', notes:''};
}
function openLesson(id){
  const l = byId(DB.lessons, id);
  if (!l) return;
  draft = JSON.parse(JSON.stringify(l));
  UI.lessonId = id;
  go('lessons');
}
RENDERERS.lessons = function(){
  if (!draft) draft = newDraft();
  let h = pageHead('Lesson planner', draft.id ? 'Editing lesson' : 'Plan a lesson', 'Build the lesson once, reuse it whenever you teach it again.',
    '<button class="btn" id="lNew">' + icon('plus', 14) + 'New lesson</button>' +
    '<button class="btn" id="lPrint">' + icon('print', 14) + 'Print</button>' +
    '<button class="btn primary" id="lSave">' + icon('check', 14) + 'Save lesson</button>');

  /* header fields */
  h += '<div class="card"><div class="card-head"><h2>Lesson details</h2>' +
       (draft.id ? '<div class="head-actions no-print"><button class="btn sm" id="lDup">' + icon('copy', 13) + 'Duplicate</button><button class="btn sm danger" id="lDel">' + icon('trash', 13) + 'Delete</button></div>' : '') + '</div>';
  h += '<div class="field"><label for="d_title">Lesson title</label><input id="d_title" type="text" value="' + esc(draft.title) + '" placeholder="e.g. Fractions on a number line"></div>';
  h += '<div class="lesson-grid">' +
    fieldSel('d_subject', 'Subject', draft.subject, ['','Math','Science','English','Reading','Writing','Social Studies','Art','Music','PE','Other']) +
    fieldTxt('d_grade', 'Grade', draft.grade, 'Grade 5') +
    fieldSel('d_classId', 'Class', draft.classId, [''].concat(DB.classes.map(c => c.id)), DB.classes) +
    fieldTxt('d_date', 'Date', draft.date, '', 'date') +
    fieldTxt('d_duration', 'Duration', draft.duration, '50 min') +
    fieldTxt('d_unit', 'Unit', draft.unit, 'Unit 4 — Fractions') +
    fieldTxt('d_standard', 'Standard', draft.standard, '5.NF.A.1') +
    '</div></div>';

  /* materials */
  h += '<div class="card"><div class="card-head"><h3>Materials</h3><span class="sub">' + draft.materials.filter(m => m.done).length + ' of ' + draft.materials.length + ' ready</span></div>' +
    '<div id="matList">' + matHTML() + '</div>' +
    '<div class="quickadd no-print"><input type="text" id="matNew" placeholder="Add a material…"><button class="btn" id="matAdd">' + icon('plus', 14) + '</button></div></div>';

  /* content sections */
  h += '<div class="grid g2" style="margin-top:18px">';
  LESSON_SECTIONS.forEach(s => {
    h += '<div class="card" style="margin:0"><div class="field" style="margin:0"><label for="d_' + s.k + '">' + s.l + '</label>' +
      '<textarea id="d_' + s.k + '" rows="' + s.rows + '" placeholder="' + esc(s.p) + '">' + esc(draft[s.k]) + '</textarea></div></div>';
  });
  h += '</div>';

  h += '<div class="head-actions no-print" style="margin-top:18px">' +
    '<button class="btn primary" id="lSave2">' + icon('check', 14) + 'Save lesson</button>' +
    '<button class="btn" id="lClear">Clear form</button></div>';

  /* saved lessons */
  h += '<div class="card no-print" style="margin-top:26px"><div class="card-head"><h2>Saved lessons</h2><span class="chip">' + DB.lessons.length + '</span></div>';
  h += '<div class="toolbar"><input type="text" id="lSearch" placeholder="Search lessons…">' +
    selectFilter('lFilterSub', 'All subjects', uniq(DB.lessons.map(l => l.subject))) +
    selectFilter('lFilterGrade', 'All grades', uniq(DB.lessons.map(l => l.grade))) +
    selectFilter('lFilterUnit', 'All units', uniq(DB.lessons.map(l => l.unit))) + '</div>';
  h += '<div id="lessonList"></div></div>';

  $('#view-lessons').innerHTML = h;
  renderLessonList();

  $('#lNew').onclick = () => { draft = newDraft(); UI.lessonId = null; RENDERERS.lessons(); toast('Blank lesson ready.'); };
  $('#lPrint').onclick = () => window.print();
  $('#lSave').onclick = saveLesson;
  $('#lSave2').onclick = saveLesson;
  $('#lClear').onclick = () => confirmAction('Clear the form?', 'Anything not saved will be lost.', 'Clear', () => { draft = newDraft(); UI.lessonId = null; RENDERERS.lessons(); });
  if ($('#lDup')) $('#lDup').onclick = () => { readDraft(); draft.id = null; draft.title = draft.title + ' (copy)'; delete draft.sample; saveLesson(); };
  if ($('#lDel')) $('#lDel').onclick = () => confirmAction('Delete lesson?', 'This removes it from your saved lessons.', 'Delete', () => {
    DB.lessons = DB.lessons.filter(x => x.id !== draft.id); save(); draft = newDraft(); toast('Lesson deleted.'); RENDERERS.lessons();
  });
  $('#matAdd').onclick = addMat;
  $('#matNew').onkeydown = e => { if (e.key === 'Enter') addMat(); };
  wireMats();
  ['lSearch','lFilterSub','lFilterGrade','lFilterUnit'].forEach(i => { const n = $('#' + i); if (n) n.oninput = renderLessonList; });
};
function fieldTxt(id, label, val, ph, type){
  return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '"></div>';
}
function fieldSel(id, label, val, opts, classList){
  let o = '';
  if (classList){
    o = '<option value="">— None —</option>' + classList.map(c => '<option value="' + c.id + '"' + (c.id === val ? ' selected' : '') + '>' + esc(c.name + ' — ' + c.grade) + '</option>').join('');
  } else {
    o = opts.map(x => '<option value="' + esc(x) + '"' + (x === val ? ' selected' : '') + '>' + (x || '— Select —') + '</option>').join('');
  }
  return '<div class="field"><label for="' + id + '">' + label + '</label><select id="' + id + '">' + o + '</select></div>';
}
function selectFilter(id, allLabel, values){
  return '<select id="' + id + '"><option value="">' + allLabel + '</option>' + values.filter(Boolean).map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('') + '</select>';
}
function uniq(a){ return Array.from(new Set(a.filter(Boolean))).sort(); }
function matHTML(){
  if (!draft.materials.length) return '<p class="sub" style="margin:0">No materials listed yet.</p>';
  return draft.materials.map((m, i) =>
    '<label class="mat"><input type="checkbox" data-mat="' + i + '"' + (m.done ? ' checked' : '') + '><span>' + esc(m.t) + '</span>' +
    '<button class="x no-print" data-matdel="' + i + '" title="Remove">&times;</button></label>').join('');
}
function wireMats(){
  $$('[data-mat]').forEach(cb => cb.onchange = () => { draft.materials[+cb.dataset.mat].done = cb.checked; });
  $$('[data-matdel]').forEach(b => b.onclick = e => { e.preventDefault(); draft.materials.splice(+b.dataset.matdel, 1); $('#matList').innerHTML = matHTML(); wireMats(); });
}
function addMat(){
  const v = $('#matNew').value.trim();
  if (!v) return;
  draft.materials.push({t:v, done:false});
  $('#matNew').value = '';
  $('#matList').innerHTML = matHTML(); wireMats();
}
function readDraft(){
  draft.title = $('#d_title').value.trim();
  ['subject','grade','classId','date','duration','unit','standard'].forEach(k => { const n = $('#d_' + k); if (n) draft[k] = n.value; });
  LESSON_SECTIONS.forEach(s => { const n = $('#d_' + s.k); if (n) draft[s.k] = n.value; });
}
function saveLesson(){
  readDraft();
  if (!draft.title){ toast('Give the lesson a title first.'); $('#d_title').focus(); return; }
  if (draft.id){
    const l = byId(DB.lessons, draft.id);
    Object.assign(l, draft);
  } else {
    draft.id = uid();
    DB.lessons.unshift(JSON.parse(JSON.stringify(draft)));
  }
  UI.lessonId = draft.id;
  save(); toast('Lesson saved successfully.'); RENDERERS.lessons();
}
function renderLessonList(){
  const q = ($('#lSearch') && $('#lSearch').value || '').toLowerCase();
  const fs = $('#lFilterSub') ? $('#lFilterSub').value : '';
  const fg = $('#lFilterGrade') ? $('#lFilterGrade').value : '';
  const fu = $('#lFilterUnit') ? $('#lFilterUnit').value : '';
  const list = DB.lessons.filter(l =>
    (!q || (l.title + ' ' + l.unit + ' ' + l.objective).toLowerCase().includes(q)) &&
    (!fs || l.subject === fs) && (!fg || l.grade === fg) && (!fu || l.unit === fu));
  const box = $('#lessonList');
  if (!DB.lessons.length){
    box.innerHTML = emptyState('lessons', 'No lessons planned yet', 'Fill in the planner above and save it — every lesson you save shows up here, ready to reopen.', 'Start with the title field', 'focusTitle');
    if ($('#focusTitle')) $('#focusTitle').onclick = () => $('#d_title').focus();
    return;
  }
  if (!list.length){ box.innerHTML = '<p class="sub" style="margin:0">No lessons match those filters.</p>'; return; }
  box.innerHTML = '<div class="grid g3">' + list.map(l =>
    '<div class="tile"><span class="band" style="background:' + (l.classId ? classColor(l.classId) : 'var(--olive)') + '"></span>' +
    '<h3>' + esc(l.title) + '</h3><div class="sub">' + esc(l.unit || 'No unit') + '</div>' +
    '<div class="tile-meta"><span>' + esc(l.subject || '—') + '</span><span>' + esc(l.grade || '—') + '</span><span>' + esc(fmtShort(l.date)) + '</span></div>' +
    '<div class="tile-foot"><span class="chip plain">' + esc(l.standard || 'No standard') + '</span>' +
    '<button class="btn tiny" data-open-lesson="' + l.id + '">Open</button></div></div>').join('') + '</div>';
  $$('[data-open-lesson]').forEach(b => b.onclick = () => openLesson(b.dataset.openLesson));
}
</script>
<script>
/* =========================================================================
   GRADE + ATTENDANCE CALCULATIONS (shared by several views)
   ========================================================================= */
function scoreOf(aId, sId){ const g = DB.grades[aId]; return g && g[sId] != null && g[sId] !== '' ? Number(g[sId]) : null; }
function setScore(aId, sId, val){
  if (!DB.grades[aId]) DB.grades[aId] = {};
  if (val === '' || val == null) delete DB.grades[aId][sId];
  else DB.grades[aId][sId] = Number(val);
}
function assignmentsOf(cid){ return DB.assignments.filter(a => a.classId === cid && a.status !== 'Draft'); }
function studentAvg(sId, cid){
  let earned = 0, poss = 0;
  assignmentsOf(cid).forEach(a => { const s = scoreOf(a.id, sId); if (s != null){ earned += s; poss += Number(a.points) || 0; } });
  return poss ? Math.round((earned / poss) * 100) : null;
}
function assignmentAvg(a){
  const list = studentsOf(a.classId).map(s => scoreOf(a.id, s.id)).filter(v => v != null);
  if (!list.length || !a.points) return null;
  return Math.round((list.reduce((x, y) => x + y, 0) / list.length / a.points) * 100);
}
function classAvg(cid){
  const list = studentsOf(cid).map(s => studentAvg(s.id, cid)).filter(v => v != null);
  return list.length ? Math.round(list.reduce((a, b) => a + b, 0) / list.length) : null;
}
function attendanceRecords(cid){
  return Object.keys(DB.attendance).filter(k => k.split('|')[0] === cid).map(k => ({date:k.split('|')[1], rec:DB.attendance[k]}));
}
function studentAttendance(sId, cid){
  const out = {present:0, absent:0, late:0, excused:0, total:0};
  attendanceRecords(cid).forEach(r => { const v = r.rec[sId]; if (v){ out[v]++; out.total++; } });
  out.pct = out.total ? Math.round(((out.present + out.late) / out.total) * 100) : null;
  return out;
}
function classAttendanceRate(cid){
  let ok = 0, tot = 0;
  attendanceRecords(cid).forEach(r => Object.values(r.rec).forEach(v => { tot++; if (v === 'present' || v === 'late') ok++; }));
  return tot ? Math.round((ok / tot) * 100) : null;
}
function overallAttendanceRate(){
  let ok = 0, tot = 0;
  Object.values(DB.attendance).forEach(rec => Object.values(rec).forEach(v => { tot++; if (v === 'present' || v === 'late') ok++; }));
  return tot ? Math.round((ok / tot) * 100) : null;
}

let aView = 'card';
RENDERERS.assignments = function(){
  let h = pageHead('Assignments', 'Assignments', 'Track what you have set, what is coming back, and what still needs grading.',
    '<div class="seg"><button data-aview="card"' + (aView === 'card' ? ' class="on"' : '') + '>Cards</button><button data-aview="list"' + (aView === 'list' ? ' class="on"' : '') + '>List</button></div>' +

  h += '<div class="card"><div class="toolbar no-print">' +
    '<select id="aClass"><option value="">All classes</option>' + DB.classes.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</select>' +
    '<select id="aStatus"><option value="">All statuses</option>' + A_STATUS.map(s => '<option>' + s + '</option>').join('') + '</select>' +
    '<select id="aDue"><option value="">Any due date</option><option value="overdue">Overdue</option><option value="week">Next 7 days</option><option value="later">Later</option></select>' +
    '<input type="text" id="aSearch" placeholder="Search assignments…"></div><div id="aList"></div></div>';

  $('#view-assignments').innerHTML = h;
  renderAssignments();
  $('#aAdd').onclick = () => assignmentForm();
  $$('[data-aview]').forEach(b => b.onclick = () => { aView = b.dataset.aview; RENDERERS.assignments(); });
  ['aClass','aStatus','aDue','aSearch'].forEach(i => $('#' + i).oninput = renderAssignments);
};
function renderAssignments(){
  const fc = $('#aClass').value, fs = $('#aStatus').value, fd = $('#aDue').value, q = $('#aSearch').value.toLowerCase();
  let list = DB.assignments.filter(a =>
    (!fc || a.classId === fc) && (!fs || a.status === fs) &&
    (!q || (a.name + ' ' + a.description).toLowerCase().includes(q)));
  if (fd === 'overdue') list = list.filter(a => a.due && daysUntil(a.due) < 0 && a.status !== 'Completed');
  if (fd === 'week') list = list.filter(a => a.due && daysUntil(a.due) >= 0 && daysUntil(a.due) <= 7);
  if (fd === 'later') list = list.filter(a => a.due && daysUntil(a.due) > 7);
  list.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));

  const box = $('#aList');
  if (!DB.assignments.length){
    box.innerHTML = emptyState('assignments', 'No assignments yet', 'Add an assignment and it will appear on your calendar, dashboard and gradebook automatically.', 'Create your first assignment', 'aAdd2');
    $('#aAdd2').onclick = () => assignmentForm();
    return;
  }
  if (!list.length){ box.innerHTML = '<p class="sub" style="margin:0">Nothing matches those filters.</p>'; return; }

  if (aView === 'list'){
    box.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Assignment</th><th>Class</th><th>Due</th><th>Points</th><th>Average</th><th>Status</th><th class="right">Edit</th></tr></thead><tbody>' +
      list.map(a => {
        const over = a.due && daysUntil(a.due) < 0 && a.status !== 'Completed';
        const av = assignmentAvg(a);
        return '<tr><td><b>' + esc(a.name) + '</b></td><td class="sub">' + esc(className(a.classId)) + '</td>' +
          '<td class="' + (over ? 'overdue' : '') + '">' + esc(relative(a.due)) + '</td><td class="num">' + a.points + '</td>' +
          '<td class="pct">' + (av != null ? av + '%' : '—') + '</td><td><span class="chip plain">' + esc(a.status) + '</span></td>' +
          '<td><div class="rowacts no-print"><button class="btn tiny" data-aedit="' + a.id + '">' + icon('edit', 12) + '</button></div></td></tr>';
      }).join('') + '</tbody></table></div>';
  } else {
    box.innerHTML = '<div class="grid g3">' + list.map(a => {
      const over = a.due && daysUntil(a.due) < 0 && a.status !== 'Completed';
      const av = assignmentAvg(a);
      return '<div class="tile"><span class="band" style="background:' + classColor(a.classId) + '"></span>' +
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>' + esc(a.name) + '</h3>' +
        '<button class="btn tiny no-print" data-aedit="' + a.id + '">' + icon('edit', 12) + '</button></div>' +
        '<div class="sub">' + esc(className(a.classId)) + ' · ' + a.points + ' points</div>' +
        (a.description ? '<p style="font-size:13px;margin:10px 0 0;color:var(--muted)">' + esc(a.description) + '</p>' : '') +
        '<div class="tile-foot"><span class="chip' + (over ? ' clay' : ' plain') + '">' + (over ? 'Overdue · ' : 'Due ') + esc(relative(a.due)) + '</span>' +
        '<span class="chip">' + esc(a.status) + (av != null ? ' · ' + av + '%' : '') + '</span></div></div>';
    }).join('') + '</div>';
  }
  $$('[data-aedit]').forEach(b => b.onclick = () => assignmentForm(b.dataset.aedit));
}
function assignmentForm(id){
  const a = id ? byId(DB.assignments, id) : null;
  if (!DB.classes.length && !a){ toast('Create a class first.'); go('classes'); return; }
  openForm({
    title: a ? 'Edit assignment' : 'New assignment',
    values: a || {assigned:TODAY(), due:shiftDay(7), points:20, status:'Assigned', classId:(DB.classes[0] || {}).id, subject:DB.settings.defaultSubject},
    fields:[
      {key:'name', label:'Assignment name', required:true, placeholder:'e.g. Fractions Quiz'},
      {key:'classId', label:'Class', type:'select', options:classOptions(), half:true},
      {key:'subject', label:'Subject', half:true},
      {key:'assigned', label:'Date assigned', type:'date', half:true},
      {key:'due', label:'Due date', type:'date', half:true},
      {key:'points', label:'Points possible', type:'number', half:true},
      {key:'status', label:'Status', type:'select', options:A_STATUS, half:true},
      {key:'description', label:'Description', type:'textarea', rows:3}
    ],
    onSave(v){
      if (a) Object.assign(a, v);
      else DB.assignments.push(Object.assign({id:uid()}, v));
      save(); toast(a ? 'Assignment updated.' : 'Assignment added.');
      if (UI.view === 'calendar') RENDERERS.calendar(); else RENDERERS.assignments();
    },
    onDelete: a ? () => { DB.assignments = DB.assignments.filter(x => x.id !== id); delete DB.grades[id]; save(); toast('Assignment deleted.'); RENDERERS.assignments(); } : null
  });
}
