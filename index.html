    }).join('') +
    '<tr><td><b>Class average</b></td>' + list.map(a => '<td style="text-align:center" class="pct">' + (assignmentAvg(a) != null ? assignmentAvg(a) + '%' : '—') + '</td>').join('') +
    '<td style="text-align:center" class="pct"><b>' + (classAvg(cid) != null ? classAvg(cid) + '%' : '—') + '</b></td></tr>' +
    '</tbody></table></div>';

  $$('[data-g]').forEach(inp => inp.onchange = () => {
    const [aId, sId] = inp.dataset.g.split('|');
    const a = byId(DB.assignments, aId);
    let v = inp.value === '' ? '' : Math.max(0, Math.min(Number(a.points), Number(inp.value)));
    if (v !== '') inp.value = v;
    setScore(aId, sId, v);
    save(); toast('Grade saved.'); renderGradebook();
  });

  $('#gChart').innerHTML = barChart(list.map(a => ({label:a.name, value:assignmentAvg(a) || 0, suffix:'%'})));
}
function barChart(data, alt){
  const max = Math.max(100, ...data.map(d => d.value));
  return '<div class="chart">' + data.map(d =>
    '<div class="bar-wrap"><span class="bar-val">' + d.value + (d.suffix || '') + '</span>' +
    '<div class="bar' + (alt ? ' alt' : '') + '" style="height:' + Math.max(3, (d.value / max) * 120) + 'px"></div>' +
    '<span class="bar-lbl">' + esc(d.label) + '</span></div>').join('') + '</div>';
}

/* =========================================================================
   5g. ATTENDANCE
   ========================================================================= */
const ATT_STATES = [['present','Present'],['absent','Absent'],['late','Late'],['excused','Excused']];
RENDERERS.attendance = function(){
  if (!UI.attClass || !classOf(UI.attClass)) UI.attClass = (DB.classes[0] || {}).id || null;
  let h = pageHead('Attendance', 'Attendance', 'Tap a status for each student. Totals update as you go.',
    '<button class="btn" id="atAll">Mark all present</button><button class="btn" id="atPrint">' + icon('print', 14) + 'Print</button>');
  if (!DB.classes.length){
    h += '<div class="card">' + emptyState('attendance', 'No classes yet', 'Attendance follows your class lists — create a class to get started.', 'Go to classes', 'atGo') + '</div>';
    $('#view-attendance').innerHTML = h;
    $('#atGo').onclick = () => go('classes');
    return;
  }
  h += '<div class="card"><div class="toolbar no-print"><select id="atClass">' +
    DB.classes.map(c => '<option value="' + c.id + '"' + (c.id === UI.attClass ? ' selected' : '') + '>' + esc(c.name + ' — ' + c.grade) + '</option>').join('') +
    '</select><input type="date" id="atDate" value="' + UI.attDate + '"></div><div id="atTable"></div></div>';
  h += '<div class="card"><div class="card-head"><h3>Monthly summary</h3><div class="sub" id="atMonthLabel"></div></div><div id="atMonth"></div></div>';

  $('#view-attendance').innerHTML = h;
  renderAttendance();
  $('#atClass').onchange = () => { UI.attClass = $('#atClass').value; renderAttendance(); };
  $('#atDate').onchange = () => { UI.attDate = $('#atDate').value || TODAY(); renderAttendance(); };
  $('#atPrint').onclick = () => window.print();
  $('#atAll').onclick = () => {
    const key = UI.attClass + '|' + UI.attDate;
    DB.attendance[key] = DB.attendance[key] || {};
    studentsOf(UI.attClass).forEach(s => DB.attendance[key][s.id] = 'present');
    save(); toast('Attendance updated.'); renderAttendance();
  };
};
function renderAttendance(){
  const cid = UI.attClass, iso = UI.attDate, key = cid + '|' + iso;
  const st = studentsOf(cid), rec = DB.attendance[key] || {};
  const box = $('#atTable');
  if (!st.length){
    box.innerHTML = emptyState('users', 'No students in this class', 'Add students to take attendance.', 'Go to classes', 'atGo2');
    $('#atGo2').onclick = () => { UI.classId = cid; go('classes'); };
    $('#atMonth').innerHTML = '';
    return;
  }
  const counts = {present:0, absent:0, late:0, excused:0};
  st.forEach(s => { if (rec[s.id]) counts[rec[s.id]]++; });
  const marked = Object.values(counts).reduce((a, b) => a + b, 0);
  const pct = marked ? Math.round(((counts.present + counts.late) / marked) * 100) : null;

  let h = '<div class="grid g4" style="margin-bottom:16px">' + [
    ['Present today', counts.present + ' / ' + st.length], ['Attendance rate', pct != null ? pct + '%' : '—'],
    ['Absent', counts.absent + counts.excused], ['Late', counts.late]
  ].map(x => '<div class="stat" style="padding:14px"><span class="label">' + x[0] + '</span><div class="big num" style="font-size:24px;margin-top:6px">' + x[1] + '</div></div>').join('') + '</div>';

  h += '<div class="sub" style="margin-bottom:10px">' + fmtDate(iso, true) + ' · ' + className(cid) + '</div>';
  h += '<div class="table-wrap"><table><thead><tr><th>Student</th><th>Status</th><th>Term rate</th><th class="right">Absences</th></tr></thead><tbody>' +
    st.map(s => {
      const at = studentAttendance(s.id, cid);
      return '<tr><td><b>' + esc(fullName(s)) + '</b></td><td><div class="att-set">' +
        ATT_STATES.map(([v, l]) => '<button class="att-btn' + (rec[s.id] === v ? ' on' : '') + '" data-s="' + v + '" data-att="' + s.id + '|' + v + '">' + l + '</button>').join('') +
        '</div></td><td class="pct' + (at.pct != null && at.pct < 90 ? ' low' : '') + '">' + (at.pct != null ? at.pct + '%' : '—') + '</td>' +
        '<td class="right num">' + (at.absent + at.excused) + (at.late ? ' · ' + at.late + ' late' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  box.innerHTML = h;

  $$('[data-att]').forEach(b => b.onclick = () => {
    const [sid, v] = b.dataset.att.split('|');
    DB.attendance[key] = DB.attendance[key] || {};
    if (DB.attendance[key][sid] === v) delete DB.attendance[key][sid];
    else DB.attendance[key][sid] = v;
    save(); renderAttendance();
  });

  /* monthly summary */
  const m = iso.slice(0, 7);
  const days = attendanceRecords(cid).filter(r => r.date.startsWith(m)).sort((a, b) => a.date.localeCompare(b.date));
  $('#atMonthLabel').textContent = MONTHS[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4) + ' · ' + days.length + ' days recorded';
  $('#atMonth').innerHTML = days.length
    ? '<div class="table-wrap"><table><thead><tr><th>Student</th>' + days.map(d => '<th style="text-align:center">' + dateObj(d.date).getDate() + '</th>').join('') + '<th style="text-align:center">Rate</th></tr></thead><tbody>' +
      st.map(s => {
        let ok = 0;
        const cells = days.map(d => {
          const v = d.rec[s.id];
          if (v === 'present' || v === 'late') ok++;
          const mark = v === 'present' ? '●' : v === 'absent' ? '✕' : v === 'late' ? 'L' : v === 'excused' ? 'E' : '·';
          const col = v === 'absent' ? 'var(--clay)' : v === 'late' ? '#C9A227' : v === 'excused' ? '#7E8FA6' : 'var(--accent)';
          return '<td style="text-align:center;color:' + (v ? col : 'var(--muted)') + '">' + mark + '</td>';
        }).join('');
        const p = Math.round(ok / days.length * 100);
        return '<tr><td>' + esc(fullName(s)) + '</td>' + cells + '<td style="text-align:center" class="pct' + (p < 90 ? ' low' : '') + '">' + p + '%</td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<p class="sub" style="margin:0">No attendance recorded this month yet.</p>';
}
</script>
<script>
/* =========================================================================
   5h. TO-DO
   ========================================================================= */
RENDERERS.todo = function(){
  const filters = ['All','Today','Upcoming','Completed'];
  let h = pageHead('To-do', 'Tasks', 'Everything off your mind and onto one list.',
    '<button class="btn primary" id="tAdd">' + icon('plus', 14) + 'New task</button>');
  h += '<div class="card"><div class="toolbar no-print"><div class="seg">' +
    filters.map(f => '<button data-tfilter="' + f + '"' + (UI.taskFilter === f ? ' class="on"' : '') + '>' + f + '</button>').join('') + '</div>' +
    '<select id="tCat"><option value="">All categories</option>' + TASK_CATS.map(c => '<option>' + c + '</option>').join('') + '</select>' +
    '<select id="tPri"><option value="">Any priority</option><option>High</option><option>Medium</option><option>Low</option></select></div>';
  h += '<div id="tList"></div>';
  h += '<div class="quickadd no-print"><input type="text" id="tQuick" placeholder="Add a task…"><button class="btn primary" id="tQuickAdd">' + icon('plus', 14) + '</button></div></div>';
  $('#view-todo').innerHTML = h;
  renderTasks();
  $('#tAdd').onclick = () => taskForm();
  $$('[data-tfilter]').forEach(b => b.onclick = () => { UI.taskFilter = b.dataset.tfilter; RENDERERS.todo(); });
  ['tCat','tPri'].forEach(i => $('#' + i).onchange = renderTasks);
  const q = () => {
    const v = $('#tQuick').value.trim();
    if (!v) return;
    DB.tasks.unshift({id:uid(), title:v, due:TODAY(), priority:'Medium', cat:'Planning', notes:'', done:false});
    $('#tQuick').value = ''; save(); toast('Task added.'); renderTasks();
  };
  $('#tQuickAdd').onclick = q;
  $('#tQuick').onkeydown = e => { if (e.key === 'Enter') q(); };
};
function renderTasks(){
  const cat = $('#tCat') ? $('#tCat').value : '', pri = $('#tPri') ? $('#tPri').value : '';
  let list = DB.tasks.filter(t => (!cat || t.cat === cat) && (!pri || t.priority === pri));
  if (UI.taskFilter === 'Today') list = list.filter(t => !t.done && t.due && daysUntil(t.due) <= 0);
  if (UI.taskFilter === 'Upcoming') list = list.filter(t => !t.done && t.due && daysUntil(t.due) > 0);
  if (UI.taskFilter === 'Completed') list = list.filter(t => t.done);
  if (UI.taskFilter === 'All') list = list.filter(t => !t.done).concat(list.filter(t => t.done));

  const box = $('#tList');
  if (!DB.tasks.length){
    box.innerHTML = emptyState('todo', 'Your list is empty', 'Add the first thing on your mind — it will show up on your dashboard too.', 'Add a task', 'tAdd2');
    $('#tAdd2').onclick = () => taskForm();
    return;
  }
  if (!list.length){ box.innerHTML = '<p class="sub" style="margin:0">Nothing here. Try another filter.</p>'; return; }
  box.innerHTML = list.map(t => '<div draggable="true" data-drag="' + t.id + '">' + taskLine(t) + '</div>').join('');
  wireTaskLines(box);

  /* drag to reorder */
  let dragId = null;
  $$('[data-drag]', box).forEach(row => {
    row.addEventListener('dragstart', () => { dragId = row.dataset.drag; row.style.opacity = '.45'; });
    row.addEventListener('dragend', () => { row.style.opacity = ''; });
    row.addEventListener('dragover', e => { e.preventDefault(); row.style.borderTop = '2px solid var(--accent)'; });
    row.addEventListener('dragleave', () => { row.style.borderTop = ''; });
    row.addEventListener('drop', e => {
      e.preventDefault(); row.style.borderTop = '';
      const targetId = row.dataset.drag;
      if (!dragId || dragId === targetId) return;
      const from = DB.tasks.findIndex(x => x.id === dragId);
      const item = DB.tasks.splice(from, 1)[0];
      const to = DB.tasks.findIndex(x => x.id === targetId);
      DB.tasks.splice(to, 0, item);
      save(); renderTasks();
    });
  });
}
function taskForm(id){
  const t = id ? byId(DB.tasks, id) : null;
  openForm({
    title: t ? 'Edit task' : 'New task',
    values: t || {due:TODAY(), priority:'Medium', cat:'Planning'},
    fields:[
      {key:'title', label:'Task', required:true, placeholder:'What needs doing?'},
      {key:'due', label:'Due date', type:'date', half:true},
      {key:'priority', label:'Priority', type:'select', options:['Low','Medium','High'], half:true},
      {key:'cat', label:'Category', type:'select', options:TASK_CATS, half:true},
      {key:'notes', label:'Notes', type:'textarea', rows:3}
    ],
    onSave(v){
      if (t) Object.assign(t, v); else DB.tasks.unshift(Object.assign({id:uid(), done:false}, v));
      save(); toast(t ? 'Task updated.' : 'Task added.');
      if (UI.view === 'todo') renderTasks(); else RENDERERS.dashboard();
    },
    onDelete: t ? () => { DB.tasks = DB.tasks.filter(x => x.id !== id); save(); toast('Task deleted.'); (UI.view === 'todo' ? renderTasks() : RENDERERS.dashboard()); } : null
  });
}

/* =========================================================================
   5i. GOALS
   ========================================================================= */
RENDERERS.goals = function(){
  let h = pageHead('Goals', 'Goals', 'The year-long work, broken into milestones you can actually tick off.',
    '<button class="btn primary" id="goAdd">' + icon('plus', 14) + 'New goal</button>');
  const school = DB.goals.filter(g => !g.studentId);
  const student = DB.goals.filter(g => g.studentId);

  h += '<div class="card"><div class="card-head"><h2>School year goals</h2><span class="chip">' + school.length + '</span></div>';
  h += school.length ? '<div class="grid g2">' + school.map(goalCard).join('') + '</div>'
    : emptyState('goals', 'No goals set yet', 'Name one thing you want to be true by the end of the year, then break it into milestones.', 'Set your first goal', 'goAdd2');
  h += '</div>';

  h += '<div class="card"><div class="card-head"><h2>Student goals</h2><span class="chip">' + student.length + '</span></div>';
  h += student.length ? '<div class="grid g2">' + student.map(goalCard).join('') + '</div>'
    : '<p class="sub" style="margin:0">Connect a goal to a student to track individual progress here.</p>';
  h += '</div>';

  $('#view-goals').innerHTML = h;
  const add = () => goalForm();
  $('#goAdd').onclick = add;
  if ($('#goAdd2')) $('#goAdd2').onclick = add;
  $$('[data-gedit]').forEach(b => b.onclick = () => goalForm(b.dataset.gedit));
  $$('[data-ms]').forEach(cb => cb.onchange = () => {
    const [gid, i] = cb.dataset.ms.split('|');
    const g = byId(DB.goals, gid);
    g.milestones[+i].done = cb.checked;
    const done = g.milestones.filter(m => m.done).length;
    g.progress = Math.round(done / g.milestones.length * 100);
    save(); RENDERERS.goals();
  });
};
function goalCard(g){
  const who = g.studentId ? byId(DB.students, g.studentId) : null;
  return '<div class="tile" style="margin:0"><span class="band"></span>' +
    '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">' +
    '<div><h3>' + esc(g.title) + '</h3><div class="sub">' + (who ? esc(fullName(who)) + ' · ' : '') + (g.deadline ? 'By ' + esc(fmtDate(g.deadline)) : 'No deadline') + '</div></div>' +
    '<button class="btn tiny no-print" data-gedit="' + g.id + '">' + icon('edit', 12) + '</button></div>' +
    (g.desc ? '<p style="font-size:13px;color:var(--muted);margin:10px 0 0">' + esc(g.desc) + '</p>' : '') +
    '<div style="margin:14px 0 6px;display:flex;justify-content:space-between;font-size:12.5px"><span class="sub">Progress</span><b class="num">' + (g.progress || 0) + '%</b></div>' +
    '<div class="progress"><span style="width:' + (g.progress || 0) + '%"></span></div>' +
    (g.milestones && g.milestones.length ? '<div style="margin-top:12px">' + g.milestones.map((m, i) =>
      '<label class="mat"><input type="checkbox" data-ms="' + g.id + '|' + i + '"' + (m.done ? ' checked' : '') + '><span style="' + (m.done ? 'color:var(--muted);text-decoration:line-through' : '') + '">' + esc(m.t) + '</span></label>').join('') + '</div>' : '') +
    '</div>';
}
function goalForm(id){
  const g = id ? byId(DB.goals, id) : null;
  openForm({
    title: g ? 'Edit goal' : 'New goal',
    values: g ? Object.assign({}, g, {ms:(g.milestones || []).map(m => m.t).join('\n')}) : {deadline:shiftDay(60), progress:0},
    fields:[
      {key:'title', label:'Goal', required:true, placeholder:'e.g. Increase student participation'},
      {key:'desc', label:'Description', type:'textarea', rows:2},
      {key:'deadline', label:'Deadline', type:'date', half:true},
      {key:'progress', label:'Progress %', type:'number', half:true},
      {key:'studentId', label:'Connect to a student', type:'select', options:[{v:'', l:'— Whole class / personal —'}].concat(DB.students.map(s => ({v:s.id, l:fullName(s) + ' — ' + className(s.classId)})))},
      {key:'ms', label:'Milestones', hint:'one per line', type:'textarea', rows:4, placeholder:'Baseline check\nMid-point review\nFinal reflection'}
    ],
    onSave(v){
      const old = g ? g.milestones || [] : [];
      const milestones = v.ms.split('\n').map(t => t.trim()).filter(Boolean).map(t => {
        const prev = old.find(m => m.t === t);
        return {t:t, done:prev ? prev.done : false};
      });
      const data = {title:v.title, desc:v.desc, deadline:v.deadline, progress:Math.max(0, Math.min(100, Number(v.progress) || 0)), studentId:v.studentId, milestones:milestones};
      if (g) Object.assign(g, data); else DB.goals.push(Object.assign({id:uid()}, data));
      save(); toast(g ? 'Goal updated.' : 'Goal added.'); RENDERERS.goals();
    },
    onDelete: g ? () => { DB.goals = DB.goals.filter(x => x.id !== id); save(); toast('Goal deleted.'); RENDERERS.goals(); } : null
  });
}

/* =========================================================================
   5j. RESOURCES
   ========================================================================= */
RENDERERS.resources = function(){
  let h = pageHead('Resources', 'Resource library', 'The links, worksheets and ideas you keep hunting for — saved once.',
    '<button class="btn primary" id="rAdd">' + icon('plus', 14) + 'Add resource</button>');
  h += '<div class="card"><div class="toolbar no-print"><input type="text" id="rSearch" placeholder="Search resources…">' +
    '<select id="rCat"><option value="">All categories</option>' + RES_CATS.map(c => '<option>' + c + '</option>').join('') + '</select></div><div id="rList"></div></div>';

    '<div class="sub">' + esc(r.category) + '</div>' +

function resourceForm(id){
  const r = id ? byId(DB.resources, id) : null;
  openForm({
    title: r ? 'Edit resource' : 'Add resource',
    values: r || {category:'Other'},
    fields:[
      {key:'title', label:'Title', required:true},
      {key:'category', label:'Category', type:'select', options:RES_CATS, half:true},
      {key:'url', label:'Link', type:'url', half:true, placeholder:'https://'},
      {key:'description', label:'Description', type:'textarea', rows:3},
      {key:'tags', label:'Tags', hint:'comma separated', placeholder:'fractions, printable'}
    ],
    onSave(v){
      if (r) Object.assign(r, v); else DB.resources.unshift(Object.assign({id:uid()}, v));
      save(); toast(r ? 'Resource updated.' : 'Resource saved.'); RENDERERS.resources();
    },
    onDelete: r ? () => { DB.resources = DB.resources.filter(x => x.id !== id); save(); toast('Resource deleted.'); RENDERERS.resources(); } : null
  });
}

/* =========================================================================
   5k. NOTES
   ========================================================================= */
RENDERERS.notes = function(){
  let h = pageHead('Notes', 'Notes', 'Student observations, meeting notes and half-formed ideas.',
    '<button class="btn primary" id="nAdd">' + icon('plus', 14) + 'New note</button>');
  h += '<div class="card"><div class="toolbar no-print"><input type="text" id="nSearch" placeholder="Search notes…">' +

  ['nSearch','nCat'].forEach(i => $('#' + i).oninput = renderNotes);
};
function renderNotes(){

    return;
  }
  if (!list.length){ box.innerHTML = '<p class="sub" style="margin:0">No notes match that search.</p>'; return; }
  box.innerHTML = '<div class="grid g3">' + list.map(n =>
    '<div class="tile"><span class="band"></span>' +
    '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>' + esc(n.title) + '</h3>' +
    '<button class="btn tiny no-print" data-nedit="' + n.id + '">' + icon('edit', 12) + '</button></div>' +
    '<div class="sub">' + esc(n.category) + ' · ' + esc(fmtDate(n.date)) + '</div>' +
    '<p style="font-size:13.5px;margin:10px 0 0;white-space:pre-wrap">' + esc(n.content) + '</p></div>').join('') + '</div>';
  $$('[data-nedit]').forEach(b => b.onclick = () => noteForm(b.dataset.nedit));
}
function noteForm(id){
  const n = id ? byId(DB.notes, id) : null;
  openForm({
    title: n ? 'Edit note' : 'New note',
    values: n || {date:TODAY(), category:'Lesson Ideas'},
    fields:[
      {key:'title', label:'Title', required:true},
      {key:'category', label:'Category', type:'select', options:NOTE_CATS, half:true},
      {key:'date', label:'Date', type:'date', half:true},
      {key:'content', label:'Note', type:'textarea', rows:7}
    ],
    onSave(v){
      if (n) Object.assign(n, v); else DB.notes.unshift(Object.assign({id:uid()}, v));
      save(); toast(n ? 'Note updated.' : 'Note saved.'); RENDERERS.notes();
    },
    onDelete: n ? () => { DB.notes = DB.notes.filter(x => x.id !== id); save(); toast('Note deleted.'); RENDERERS.notes(); } : null
  });
}

/* =========================================================================
   5l. REPORTS
   ========================================================================= */
RENDERERS.reports = function(){
  const totalStudents = DB.students.length;
  const graded = DB.assignments.filter(a => assignmentAvg(a) != null);
  const overallAvg = graded.length ? Math.round(graded.reduce((s, a) => s + assignmentAvg(a), 0) / graded.length) : null;
  const attRate = overallAttendanceRate();

  let h = pageHead('Reports', 'Your year so far', 'A read on the whole class list, pulled from what you have already entered.',
    '<button class="btn" id="repPrint">' + icon('print', 14) + 'Print report</button>');

  h += '<div class="grid g3" style="margin-bottom:18px">' + [
    {l:'Classes', v:DB.classes.length, f:DB.schedule.length + ' periods a week', i:'classes'},
    {l:'Students', v:totalStudents, f:'Across all classes', i:'users'},
    {l:'Lessons planned', v:DB.lessons.length, f:uniq(DB.lessons.map(l => l.unit)).length + ' units', i:'lessons'},
    {l:'Assignments', v:DB.assignments.length, f:DB.assignments.filter(a => a.status === 'Completed').length + ' completed', i:'assignments'},
    {l:'Average grade', v:(overallAvg != null ? overallAvg + '%' : '—'), f:graded.length + ' graded items', i:'gradebook'},
    {l:'Attendance rate', v:(attRate != null ? attRate + '%' : '—'), f:Object.keys(DB.attendance).length + ' class days recorded', i:'attendance'}
  ].map(x => '<div class="stat"><div class="top"><span class="label">' + x.l + '</span><span class="ico">' + icon(x.i, 16) + '</span></div>' +
    '<div class="big num">' + x.v + '</div><div class="foot">' + esc(x.f) + '</div></div>').join('') + '</div>';

  /* grades over time */
  const byDate = DB.assignments.filter(a => assignmentAvg(a) != null && a.due).sort((a, b) => a.due.localeCompare(b.due));
  h += '<div class="grid g2">';
  h += '<div class="card" style="margin:0"><div class="card-head"><h3>Grades over time</h3><div class="sub">Class average per assignment</div></div>' +
    (byDate.length ? barChart(byDate.map(a => ({label:fmtShort(a.due), value:assignmentAvg(a), suffix:'%'})))
      : '<p class="sub" style="margin:0">Enter a few grades to see this chart.</p>') + '</div>';

  /* attendance per class */
  h += '<div class="card" style="margin:0"><div class="card-head"><h3>Attendance by class</h3><div class="sub">Present or late, all recorded days</div></div>' +
    (DB.classes.length ? barChart(DB.classes.map(c => ({label:c.name, value:classAttendanceRate(c.id) || 0, suffix:'%'})), true)
      : '<p class="sub" style="margin:0">No classes yet.</p>') + '</div>';

  /* assignment completion */
  h += '<div class="card" style="margin:0"><div class="card-head"><h3>Assignment status</h3><div class="sub">Where your assignments sit right now</div></div>' +
    (DB.assignments.length ? barChart(A_STATUS.map(s => ({label:s, value:DB.assignments.filter(a => a.status === s).length})))
      : '<p class="sub" style="margin:0">No assignments yet.</p>') + '</div>';

  /* weekly workload */
  const workload = [1,2,3,4,5].map(d => ({
    label:DOW[d].slice(0, 3),
    value:DB.schedule.filter(s => Number(s.day) === d).length + DB.tasks.filter(t => t.due === mondayOfThisWeek(d) && !t.done).length
  }));
  h += '<div class="card" style="margin:0"><div class="card-head"><h3>Weekly workload</h3><div class="sub">Class periods plus open tasks per day</div></div>' +
    barChart(workload, true) + '</div>';
  h += '</div>';

  /* per class table */
  h += '<div class="card"><div class="card-head"><h3>Class by class</h3></div>';
  h += DB.classes.length ? '<div class="table-wrap"><table><thead><tr><th>Class</th><th>Students</th><th>Assignments</th><th>Average</th><th>Attendance</th></tr></thead><tbody>' +
    DB.classes.map(c => '<tr><td><b>' + esc(c.name) + '</b> <span class="sub">' + esc(c.grade) + '</span></td>' +
      '<td class="num">' + studentsOf(c.id).length + '</td><td class="num">' + DB.assignments.filter(a => a.classId === c.id).length + '</td>' +
      '<td class="pct">' + (classAvg(c.id) != null ? classAvg(c.id) + '%' : '—') + '</td>' +
      '<td class="pct">' + (classAttendanceRate(c.id) != null ? classAttendanceRate(c.id) + '%' : '—') + '</td></tr>').join('') +
    '</tbody></table></div>' : '<p class="sub" style="margin:0">No classes yet.</p>';
  h += '</div>';

  $('#view-reports').innerHTML = h;
  $('#repPrint').onclick = () => window.print();
};

/* =========================================================================
   5m. SETTINGS
   ========================================================================= */
RENDERERS.settings = function(){
  const s = DB.settings;
  let h = pageHead('Settings', 'Settings', 'Your school year details, appearance and data.');

  if (s.sample){
    h += '<div class="banner no-print"><span><b>Sample planner loaded.</b> Emily Carter\'s classes are here so you can see how everything works. Clear them whenever you are ready to add your own.</span>' +
      '<button class="btn sm" id="clearSample">Remove sample data</button></div>';
  }

  h += '<div class="card"><div class="card-head"><h2>School year setup</h2></div>' +
    '<div class="row"><div class="field"><label for="setName">Teacher name</label><input id="setName" type="text" value="' + esc(s.teacherName) + '" placeholder="Your name"></div>' +
    '<div class="field"><label for="setSchool">School name</label><input id="setSchool" type="text" value="' + esc(s.schoolName) + '" placeholder="Your school"></div></div>' +
    '<div class="row"><div class="field"><label for="setYear">School year</label><input id="setYear" type="text" value="' + esc(s.schoolYear) + '" placeholder="2026–2027"></div>' +
    '<div class="field"><label for="setGrade">Default grade</label><input id="setGrade" type="text" value="' + esc(s.defaultGrade) + '" placeholder="Grade 5"></div></div>' +
    '<div class="field"><label for="setSubject">Default subject</label><input id="setSubject" type="text" value="' + esc(s.defaultSubject) + '" placeholder="Math"></div>' +
    '<button class="btn primary" id="setSave">' + icon('check', 14) + 'Save changes</button></div>';

  h += '<div class="card"><div class="card-head"><h2>Appearance</h2></div>' +
    '<div class="list-line"><div><div class="ll-t">Theme</div><div class="ll-m">Warm ivory by default. Dark keeps the same olive and cream palette.</div></div>' +
    '<div class="seg"><button data-theme-set="light"' + (s.theme !== 'dark' ? ' class="on"' : '') + '>Light</button><button data-theme-set="dark"' + (s.theme === 'dark' ? ' class="on"' : '') + '>Dark</button></div></div></div>';

  h += '<div class="card"><div class="card-head"><h2>Your data</h2></div>' +
    '<p class="sub" style="margin:0 0 16px">Everything lives in this browser only — nothing is uploaded anywhere. Export a copy before switching computers or clearing your browser.</p>' +
    '<div class="list-line"><div><div class="ll-t">Export my planner</div><div class="ll-m">Downloads one JSON file with every class, lesson, grade and note.</div></div>' +
    '<button class="btn" id="doExport">' + icon('download', 14) + 'Export</button></div>' +
    '<div class="list-line"><div><div class="ll-t">Import planner</div><div class="ll-m">Loads a file you exported earlier. This replaces what is here now.</div></div>' +
    '<button class="btn" id="doImport">' + icon('upload', 14) + 'Import</button></div>' +
    '<div class="list-line"><div><div class="ll-t">Clear all data</div><div class="ll-m">Erases everything in this browser and starts a blank planner.</div></div>' +
    '<button class="btn danger" id="doClear">' + icon('trash', 14) + 'Clear</button></div>' +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>';

  h += '<div class="card"><div class="card-head"><h2>About</h2></div>' +
    '<p class="sub" style="margin:0">TeacherFlow Pro · Plan less. Teach better. A standalone planner that runs entirely in your browser — no account, no subscription, no internet needed after the first load.</p></div>';

  $('#view-settings').innerHTML = h;

  $('#setSave').onclick = () => {
    s.teacherName = $('#setName').value.trim();
    s.schoolName = $('#setSchool').value.trim();
    s.schoolYear = $('#setYear').value.trim();
    s.defaultGrade = $('#setGrade').value.trim();
    s.defaultSubject = $('#setSubject').value.trim();
    save(); paintWho(); toast('Changes saved.');
  };
  $$('[data-theme-set]').forEach(b => b.onclick = () => setTheme(b.dataset.themeSet, true));
  $('#doExport').onclick = exportData;
  $('#doImport').onclick = () => $('#importFile').click();
  $('#importFile').onchange = importData;
  $('#doClear').onclick = () => confirmAction('Clear all data?',
    'This permanently deletes every class, student, lesson, grade and note stored in this browser. Export a copy first if you might want it back.',
    'Clear everything', () => {
      DB = blank();
      DB.settings.theme = document.documentElement.dataset.theme;
      save(); paintWho(); toast('Planner cleared.'); go('dashboard');
    });
  if ($('#clearSample')) $('#clearSample').onclick = () => confirmAction('Remove sample data?',
    'This deletes Emily Carter\'s demo classes, students, lessons and grades. Anything you added yourself stays.',
    'Remove samples', removeSamples);
};
function removeSamples(){
  ['classes','students','schedule','lessons','assignments','events','tasks','goals','resources','notes'].forEach(k => {
    DB[k] = DB[k].filter(x => !x.sample);
  });
  Object.keys(DB.grades).forEach(k => { if (!byId(DB.assignments, k)) delete DB.grades[k]; });
  Object.keys(DB.attendance).forEach(k => { if (!classOf(k.split('|')[0])) delete DB.attendance[k]; });
  if (DB.settings.teacherName === 'Emily Carter'){ DB.settings.teacherName = ''; DB.settings.schoolName = ''; }
  DB.settings.sample = false;
  UI.classId = null; UI.gradeClass = null; UI.attClass = null;
  save(); paintWho(); toast('Sample data removed.'); RENDERERS.settings();
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'teacherflow-planner-' + TODAY() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Planner exported.');
}
function importData(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object' || !data.settings) throw new Error('bad file');
      confirmAction('Replace your planner?', 'Importing overwrites everything currently in this browser.', 'Import', () => {
        DB = Object.assign(blank(), data);
        save(); paintWho(); setTheme(DB.settings.theme || 'light');
        toast('Planner imported.'); go('dashboard');
      });
    } catch(err){
      toast('That file could not be read. Use a file exported from TeacherFlow Pro.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

/* =========================================================================
   6. GLOBAL SEARCH
   ========================================================================= */
function runSearch(q){
  q = q.toLowerCase().trim();
  if (!q) return;
  const groups = [
    {name:'Lessons', items:DB.lessons.filter(l => (l.title + ' ' + l.unit + ' ' + l.objective).toLowerCase().includes(q))
      .map(l => ({t:l.title, s:[l.subject, l.unit].filter(Boolean).join(' · '), go:() => openLesson(l.id)}))},
    {name:'Assignments', items:DB.assignments.filter(a => (a.name + ' ' + a.description).toLowerCase().includes(q))
      .map(a => ({t:a.name, s:className(a.classId) + ' · due ' + relative(a.due), go:() => { go('assignments'); assignmentForm(a.id); }}))},
    {name:'Students', items:DB.students.filter(s => (fullName(s) + ' ' + s.sid + ' ' + s.email + ' ' + s.notes).toLowerCase().includes(q))
      .map(s => ({t:fullName(s), s:className(s.classId), go:() => { UI.classId = s.classId; go('classes'); studentProfile(s.id); }}))},
    {name:'Notes', items:DB.notes.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(q))
      .map(n => ({t:n.title, s:n.category + ' · ' + fmtDate(n.date), go:() => { go('notes'); noteForm(n.id); }}))},
    {name:'Resources', items:DB.resources.filter(r => (r.title + ' ' + r.description + ' ' + r.tags).toLowerCase().includes(q))
      .map(r => ({t:r.title, s:r.category, go:() => { go('resources'); resourceForm(r.id); }}))},
    {name:'Classes', items:DB.classes.filter(c => (c.name + ' ' + c.subject + ' ' + c.grade).toLowerCase().includes(q))
      .map(c => ({t:c.name + ' — ' + c.grade, s:c.subject + (c.room ? ' · Room ' + c.room : ''), go:() => { UI.classId = c.id; go('classes'); }}))}
  ].filter(g => g.items.length);

  const total = groups.reduce((n, g) => n + g.items.length, 0);
  let body = total ? groups.map((g, gi) => '<div class="results-group"><h4>' + g.name + ' · ' + g.items.length + '</h4>' +
      g.items.slice(0, 6).map((it, i) => '<div class="result" data-res="' + gi + '|' + i + '"><b>' + esc(it.t) + '</b><span>' + esc(it.s) + '</span></div>').join('') + '</div>').join('')
    : '<p class="sub" style="margin:0">Nothing matched “' + esc(q) + '”. Try a student name, a lesson title or a tag.</p>';

  openModal('Search results', body, '<button class="btn" id="srClose">Close</button>');
  $('#srClose').onclick = closeModal;
  $$('[data-res]').forEach(node => node.onclick = () => {
    const [gi, i] = node.dataset.res.split('|').map(Number);
    closeModal();
    groups[gi].items[i].go();
  });
}

/* =========================================================================
   7. THEME, CHROME, BOOT
   ========================================================================= */
function setTheme(mode, announce){
  document.documentElement.dataset.theme = mode;
  DB.settings.theme = mode;
  save();
  $('#themeToggle').innerHTML = icon(mode === 'dark' ? 'sun' : 'moon', 16);
  if (announce){ toast(mode === 'dark' ? 'Dark theme on.' : 'Light theme on.'); if (UI.view === 'settings') RENDERERS.settings(); }
}
function paintWho(){
  $('#whoName').textContent = DB.settings.teacherName || 'Your planner';
  $('#whoSchool').textContent = [DB.settings.schoolName, DB.settings.schoolYear].filter(Boolean).join(' · ') || 'Add your school in Settings';
}
function boot(){
  load();
  buildNav();
  paintWho();
  setTheme(DB.settings.theme === 'dark' ? 'dark' : 'light');
  RENDERERS.dashboard();

  /* chrome wiring */
  $('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
  $('#scrim').onclick = closeSidebar;
  $('#menuSearch').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); setTimeout(() => $('#globalSearch').focus(), 200); };
  $('#themeToggle').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
  $('#modalX').onclick = closeModal;
  $('#modalBg').onclick = e => { if (e.target === $('#modalBg')) closeModal(); };
  $('#globalSearch').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ runSearch(e.target.value); e.target.value = ''; closeSidebar(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modalBg').classList.contains('show')) closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k'){ e.preventDefault(); $('#sidebar').classList.add('open'); $('#globalSearch').focus(); }
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
